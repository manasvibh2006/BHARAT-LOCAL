services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bharat_postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-bharat_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bharat_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 Cache & Queue Engine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bharat_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Bharat Local API & Web Platform
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bharat_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      APP_NAME: BharatLocal
      JWT_SECRET: ${JWT_SECRET:-bharat_local_super_secret_jwt_key_2026_dev}
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-bharat_local}
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL_SECONDS: 300
      OTP_DEV_MOCK_CODE: 123456
      OTP_EXPIRY_MINUTES: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
